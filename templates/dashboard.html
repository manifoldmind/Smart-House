{% extends "base.html" %}
{% block content %}
<h1>Панель управления</h1>
<div class="row">
    {% for device in devices %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ device.name }}</h5>
                <p class="card-text">Тип: {{ device.type }}, Статус: {{ device.status }}</p>
                <form action="/devices/toggle/{{ device.id }}" method="post">
                    <button type="submit" class="btn btn-{{ 'success' if device.status == 'off' else 'danger' }}">
                        {{ 'Включить' if device.status == 'off' else 'Выключить' }}
                    </button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
